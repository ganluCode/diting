[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diting"
version = "0.1.0"
description = "Code knowledge graph system — multi-language, Neo4j, FastAPI + MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Neo4j
    "neo4j>=5.0.0",
    # Web / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "fastapi-pagination>=0.12.0",
    # MCP
    "fastmcp>=2.0.0",
    # Config
    "pydantic-settings>=2.0.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
    # NL2Cypher
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    # Java scanner (jedi for Python scanner)
    "jedi>=0.19.0",
    # PostgreSQL + ORM
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Utils
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
diting = "diting.cli.main:app"
diting-mcp = "diting.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diting"]

[tool.hatch.build.targets.sdist]
include = ["src/diting", "pyproject.toml", "README.md"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
